# Refresh the push side every evening after the NSE close: exchange filings (BSE) and
# end-of-day prices (Yahoo). Promise records change quarterly and are rebuilt by hand.
#
# Needs one repository secret: GEMINI_API_KEY (Settings → Secrets and variables → Actions).
# Fetched documents and model responses are kept in the Actions cache between runs, so a
# day's refresh only pays for new filings.
name: Refresh filings and prices

on:
  schedule:
    - cron: "30 13 * * *"   # 19:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/raw
            data/text
          key: finn-data-${{ github.run_id }}
          restore-keys: finn-data-

      - name: Build filings digest and prices
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.build_push

      - name: Commit if anything changed
        run: |
          git config user.name "finn-refresh"
          git config user.email "finn-refresh@users.noreply.github.com"
          git add web/public/data/filings.json web/public/data/prices.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh filings and prices ($(date -u +%F))"
            git push
          fi
