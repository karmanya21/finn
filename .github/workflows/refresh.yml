# Refresh end-of-day prices (Yahoo) every evening after the NSE close, so price and volume
# alerts stay current.
#
# Filings are refreshed by hand (see README): BSE's announcements API answers 403 to
# GitHub's runners, so they have to be fetched from a machine in India. Prices need no
# model calls, so this workflow needs no secrets.
name: Refresh prices

on:
  schedule:
    - cron: "30 13 * * *"   # 19:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Fetch end-of-day prices
        working-directory: backend
        run: python -m scripts.build_push prices

      - name: Commit if anything changed
        run: |
          git config user.name "finn-refresh"
          git config user.email "finn-refresh@users.noreply.github.com"
          git add web/public/data/prices.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh prices ($(date -u +%F))"
            git push
          fi
